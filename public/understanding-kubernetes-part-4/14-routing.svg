<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .node-label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <filter id="rsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="rgray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="rblue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/>
    </marker>
    <marker id="rgreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">One Address, Many Destinations</text>
  <text x="40" y="68" class="subtitle">The controller picks a backend by looking at the request's Host header and URL path</text>

  <!-- Requests -->
  <g filter="url(#rsoft)">
    <rect x="60" y="92" width="230" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="175" y="113" class="tiny" text-anchor="middle" font-weight="700" fill="#92400e">🌍 request A</text>
  <text x="175" y="132" class="mono" text-anchor="middle" fill="#92400e" font-size="11">shop.example.com/one</text>

  <g filter="url(#rsoft)">
    <rect x="335" y="92" width="230" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="450" y="113" class="tiny" text-anchor="middle" font-weight="700" fill="#92400e">🌍 request B</text>
  <text x="450" y="132" class="mono" text-anchor="middle" fill="#92400e" font-size="11">shop.example.com/two</text>

  <g filter="url(#rsoft)">
    <rect x="610" y="92" width="230" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="725" y="113" class="tiny" text-anchor="middle" font-weight="700" fill="#92400e">🌍 request C</text>
  <text x="725" y="132" class="mono" text-anchor="middle" fill="#92400e" font-size="11">api.example.com/</text>

  <!-- arrows into LB -->
  <path d="M 175 144 C 250 168, 310 172, 360 186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#rgray)"/>
  <path d="M 450 144 L 450 186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#rgray)"/>
  <path d="M 725 144 C 650 168, 590 172, 540 186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#rgray)"/>

  <!-- Load balancer -->
  <g filter="url(#rsoft)">
    <rect x="290" y="192" width="320" height="54" rx="10" fill="#0080FF"/>
  </g>
  <text x="450" y="214" class="small" fill="#ffffff" text-anchor="middle" font-weight="700">Cloud Load Balancer</text>
  <text x="450" y="234" class="mono" fill="#dbeafe" text-anchor="middle" font-size="11">138.197.231.12 · one IP for all hosts</text>

  <path d="M 450 246 L 450 296" fill="none" stroke="#0080FF" stroke-width="2" marker-end="url(#rblue)"/>

  <!-- Cluster boundary -->
  <rect x="40" y="266" width="820" height="330" rx="16" fill="#fafaf9" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="62" y="290" class="badge" fill="#78716c">☸️ YOUR CLUSTER</text>

  <!-- Ingress controller with rule table -->
  <g filter="url(#rsoft)">
    <rect x="180" y="300" width="540" height="146" rx="12" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  </g>
  <rect x="180" y="300" width="540" height="32" rx="12" fill="#326CE5"/>
  <rect x="180" y="316" width="540" height="16" fill="#326CE5"/>
  <text x="450" y="322" class="node-label" fill="#ffffff" text-anchor="middle" font-size="14">Ingress Controller — the rule table</text>

  <rect x="198" y="342" width="504" height="30" rx="6" fill="#ffffff" stroke="#c7ddfa"/>
  <text x="212" y="362" class="mono" fill="#1e3a5f" font-size="11">host: shop.example.com   path: /one   →  Service app-one:80</text>

  <rect x="198" y="376" width="504" height="30" rx="6" fill="#ffffff" stroke="#c7ddfa"/>
  <text x="212" y="396" class="mono" fill="#1e3a5f" font-size="11">host: shop.example.com   path: /two   →  Service app-two:80</text>

  <rect x="198" y="410" width="504" height="30" rx="6" fill="#ffffff" stroke="#c7ddfa"/>
  <text x="212" y="430" class="mono" fill="#1e3a5f" font-size="11">host: api.example.com    path: /      →  Service app-two:80</text>

  <!-- arrows to services -->
  <path d="M 300 446 C 260 470, 220 476, 190 490" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#rblue)"/>
  <path d="M 450 446 L 450 490" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#rblue)"/>
  <path d="M 600 446 C 640 470, 680 476, 710 490" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#rblue)"/>

  <!-- services -->
  <rect x="90" y="494" width="200" height="44" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  <text x="190" y="521" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: app-one (ClusterIP)</text>

  <rect x="350" y="494" width="200" height="44" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  <text x="450" y="521" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: app-two (ClusterIP)</text>

  <rect x="610" y="494" width="200" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="710" y="514" class="tiny" text-anchor="middle" fill="#94a3b8">two rules can point at</text>
  <text x="710" y="530" class="tiny" text-anchor="middle" fill="#94a3b8">the same service</text>

  <!-- pods -->
  <path d="M 190 538 L 190 556" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#rgreen)"/>
  <path d="M 450 538 L 450 556" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#rgreen)"/>
  <rect x="110" y="558" width="160" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="190" y="578" class="tiny" text-anchor="middle" font-weight="700" fill="#065f46">app-one pods</text>
  <rect x="370" y="558" width="160" height="30" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="578" class="tiny" text-anchor="middle" font-weight="700" fill="#065f46">app-two pods</text>

  <!-- caption -->
  <rect x="40" y="608" width="820" height="40" rx="8" fill="#eaf1fd" stroke="#326CE5"/>
  <text x="450" y="633" class="small" text-anchor="middle" fill="#1e3a5f" font-weight="600">Ingress works at HTTP level (layer 7) — it can read hostnames and paths. A Service only sees ports.</text>
</svg>
