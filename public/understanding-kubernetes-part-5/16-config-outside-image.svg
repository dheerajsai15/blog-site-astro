<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <filter id="csoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="cred" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="cblue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/>
    </marker>
  </defs>

  <rect width="900" height="540" fill="#ffffff"/>

  <text x="40" y="46" class="title">Configuration does not belong in the image</text>
  <text x="40" y="68" class="subtitle">Build the artifact once. Decide what it connects to at the moment it starts.</text>

  <!-- divider -->
  <line x1="450" y1="92" x2="450" y2="452" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- LEFT: baked in -->
  <text x="40" y="112" class="badge" fill="#b91c1c">BAKED IN — ONE IMAGE PER ENVIRONMENT</text>

  <g filter="url(#csoft)">
    <rect x="40" y="126" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="130" y="148" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">api:dev</text>
  <text x="56" y="170" class="mono" fill="#7f1d1d">code</text>
  <text x="56" y="190" class="mono" fill="#b91c1c">PORT=5000</text>
  <text x="56" y="208" class="mono" fill="#b91c1c">DB=dev-db</text>

  <g filter="url(#csoft)">
    <rect x="240" y="126" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="330" y="148" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">api:staging</text>
  <text x="256" y="170" class="mono" fill="#7f1d1d">code</text>
  <text x="256" y="190" class="mono" fill="#b91c1c">PORT=8080</text>
  <text x="256" y="208" class="mono" fill="#b91c1c">DB=stg-db</text>

  <g filter="url(#csoft)">
    <rect x="40" y="238" width="180" height="96" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <text x="130" y="260" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">api:prod</text>
  <text x="56" y="282" class="mono" fill="#7f1d1d">code</text>
  <text x="56" y="302" class="mono" fill="#b91c1c">PORT=80</text>
  <text x="56" y="320" class="mono" fill="#b91c1c">DB=prod-db</text>

  <rect x="240" y="238" width="180" height="96" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="330" y="278" class="small" text-anchor="middle" fill="#b91c1c" font-weight="700">…and one more</text>
  <text x="330" y="298" class="tiny" text-anchor="middle" fill="#b91c1c">every time a value changes</text>

  <rect x="40" y="352" width="380" height="76" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="376" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">The image you tested is not the image you ship.</text>
  <text x="230" y="398" class="tiny" text-anchor="middle" fill="#7f1d1d">A password change means a rebuild, and the secret is</text>
  <text x="230" y="415" class="tiny" text-anchor="middle" fill="#7f1d1d">now a permanent layer that anyone who pulls can read.</text>

  <!-- RIGHT: injected -->
  <text x="480" y="112" class="badge" fill="#1d4ed8">INJECTED AT RUNTIME — ONE IMAGE, MANY CONFIGS</text>

  <g filter="url(#csoft)">
    <rect x="480" y="126" width="150" height="200" rx="10" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  </g>
  <rect x="480" y="126" width="150" height="28" rx="10" fill="#326CE5"/>
  <rect x="480" y="140" width="150" height="14" fill="#326CE5"/>
  <text x="555" y="146" class="badge" fill="#ffffff" text-anchor="middle">THE IMAGE</text>
  <text x="555" y="182" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">api:v1</text>
  <text x="555" y="208" class="mono" text-anchor="middle" fill="#1e3a5f">code only</text>
  <text x="555" y="242" class="tiny" text-anchor="middle" fill="#1e3a5f">reads values from</text>
  <text x="555" y="260" class="mono" text-anchor="middle" fill="#1e3a5f">process.env</text>
  <text x="555" y="292" class="tiny" text-anchor="middle" fill="#059669" font-weight="700">built once</text>
  <text x="555" y="309" class="tiny" text-anchor="middle" fill="#059669" font-weight="700">never rebuilt for config</text>

  <path d="M 700 172 L 646 200" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#cblue)"/>
  <path d="M 700 226 L 646 226" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#cblue)"/>
  <path d="M 700 280 L 646 252" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#cblue)"/>

  <rect x="704" y="152" width="156" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="782" y="177" class="mono" text-anchor="middle" fill="#334155">ConfigMap · dev</text>

  <rect x="704" y="206" width="156" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="782" y="231" class="mono" text-anchor="middle" fill="#334155">ConfigMap · staging</text>

  <rect x="704" y="260" width="156" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="782" y="285" class="mono" text-anchor="middle" fill="#334155">ConfigMap · prod</text>

  <rect x="480" y="352" width="380" height="76" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="670" y="376" class="small" text-anchor="middle" font-weight="700" fill="#065f46">The same bytes run everywhere.</text>
  <text x="670" y="398" class="tiny" text-anchor="middle" fill="#065f46">Changing a value is an edit to a small YAML object,</text>
  <text x="670" y="415" class="tiny" text-anchor="middle" fill="#065f46">not a rebuild and not a redeploy of the artifact.</text>

  <!-- caption -->
  <rect x="40" y="452" width="820" height="60" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="478" class="small" text-anchor="middle" font-weight="700" fill="#92400e">A ConfigMap holds the values that are merely environment-specific. A Secret holds the ones that are sensitive.</text>
  <text x="450" y="499" class="tiny" text-anchor="middle" fill="#92400e">Mechanically they are almost the same object — the difference is how Kubernetes treats them, and who is allowed to read them.</text>
</svg>
