<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .node-label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 12px; font-weight: 700; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <filter id="wsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="wgray" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="wblue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">Why Ingress Exists</text>
  <text x="40" y="68" class="subtitle">A LoadBalancer per service means a cloud load balancer per service — and a bill per service</text>

  <!-- ============ LEFT PANEL ============ -->
  <rect x="40" y="92" width="390" height="400" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="62" y="120" class="badge" fill="#b91c1c">WITHOUT INGRESS</text>

  <!-- row 1 -->
  <g filter="url(#wsoft)">
    <rect x="62" y="140" width="160" height="56" rx="10" fill="#0080FF"/>
  </g>
  <text x="142" y="164" class="small" fill="#ffffff" text-anchor="middle" font-weight="700">Load Balancer 1</text>
  <text x="142" y="183" class="mono" fill="#dbeafe" text-anchor="middle" font-size="11">$12 / month 💰</text>
  <path d="M 224 168 L 246 168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#wgray)"/>
  <rect x="250" y="140" width="158" height="56" rx="10" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  <text x="329" y="164" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: shop</text>
  <text x="329" y="183" class="tiny" text-anchor="middle" fill="#6b7280">type: LoadBalancer</text>

  <!-- row 2 -->
  <g filter="url(#wsoft)">
    <rect x="62" y="216" width="160" height="56" rx="10" fill="#0080FF"/>
  </g>
  <text x="142" y="240" class="small" fill="#ffffff" text-anchor="middle" font-weight="700">Load Balancer 2</text>
  <text x="142" y="259" class="mono" fill="#dbeafe" text-anchor="middle" font-size="11">$12 / month 💰</text>
  <path d="M 224 244 L 246 244" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#wgray)"/>
  <rect x="250" y="216" width="158" height="56" rx="10" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  <text x="329" y="240" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: api</text>
  <text x="329" y="259" class="tiny" text-anchor="middle" fill="#6b7280">type: LoadBalancer</text>

  <!-- row 3 -->
  <g filter="url(#wsoft)">
    <rect x="62" y="292" width="160" height="56" rx="10" fill="#0080FF"/>
  </g>
  <text x="142" y="316" class="small" fill="#ffffff" text-anchor="middle" font-weight="700">Load Balancer 3</text>
  <text x="142" y="335" class="mono" fill="#dbeafe" text-anchor="middle" font-size="11">$12 / month 💰</text>
  <path d="M 224 320 L 246 320" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#wgray)"/>
  <rect x="250" y="292" width="158" height="56" rx="10" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  <text x="329" y="316" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: blog</text>
  <text x="329" y="335" class="tiny" text-anchor="middle" fill="#6b7280">type: LoadBalancer</text>

  <!-- left summary -->
  <rect x="62" y="374" width="346" height="98" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="235" y="400" class="small" text-anchor="middle" font-weight="700" fill="#b91c1c">3 services = 3 load balancers = 3 IPs = 3 bills</text>
  <text x="235" y="424" class="tiny" text-anchor="middle" fill="#7f1d1d">Every service needs its own DNS record.</text>
  <text x="235" y="444" class="tiny" text-anchor="middle" fill="#7f1d1d">No way to share one domain across them.</text>
  <text x="235" y="464" class="tiny" text-anchor="middle" fill="#7f1d1d">TLS certificates configured three times.</text>

  <!-- ============ RIGHT PANEL ============ -->
  <rect x="470" y="92" width="390" height="400" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="492" y="120" class="badge" fill="#047857">WITH INGRESS</text>

  <!-- single LB -->
  <g filter="url(#wsoft)">
    <rect x="560" y="140" width="210" height="56" rx="10" fill="#0080FF"/>
  </g>
  <text x="665" y="164" class="small" fill="#ffffff" text-anchor="middle" font-weight="700">One Load Balancer</text>
  <text x="665" y="183" class="mono" fill="#dbeafe" text-anchor="middle" font-size="11">$12 / month 💰</text>

  <path d="M 665 196 L 665 226" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#wblue)"/>

  <!-- ingress controller -->
  <g filter="url(#wsoft)">
    <rect x="510" y="228" width="310" height="78" rx="12" fill="#326CE5"/>
  </g>
  <text x="665" y="255" class="node-label" fill="#ffffff" text-anchor="middle">Ingress Controller</text>
  <text x="665" y="278" class="tiny" fill="#dbeafe" text-anchor="middle">reads your rules, routes by host and path</text>

  <!-- fan out -->
  <path d="M 580 306 C 560 324, 552 332, 548 344" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#wblue)"/>
  <path d="M 665 306 L 665 344" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#wblue)"/>
  <path d="M 750 306 C 770 324, 778 332, 782 344" fill="none" stroke="#326CE5" stroke-width="2" marker-end="url(#wblue)"/>

  <rect x="498" y="350" width="100" height="52" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  <text x="548" y="372" class="tiny" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: shop</text>
  <text x="548" y="390" class="tiny" text-anchor="middle" fill="#6b7280">ClusterIP</text>

  <rect x="615" y="350" width="100" height="52" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  <text x="665" y="372" class="tiny" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: api</text>
  <text x="665" y="390" class="tiny" text-anchor="middle" fill="#6b7280">ClusterIP</text>

  <rect x="732" y="350" width="100" height="52" rx="8" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  <text x="782" y="372" class="tiny" text-anchor="middle" font-weight="700" fill="#1e3a5f">Service: blog</text>
  <text x="782" y="390" class="tiny" text-anchor="middle" fill="#6b7280">ClusterIP</text>

  <!-- right summary -->
  <rect x="492" y="420" width="346" height="52" rx="8" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="665" y="443" class="small" text-anchor="middle" font-weight="700" fill="#047857">1 load balancer, 1 IP, 1 bill, 1 place for TLS</text>
  <text x="665" y="462" class="tiny" text-anchor="middle" fill="#065f46">Add a tenth service by editing a rule, not by renting hardware.</text>

  <!-- caption -->
  <rect x="40" y="504" width="820" height="40" rx="8" fill="#eaf1fd" stroke="#326CE5"/>
  <text x="450" y="529" class="small" text-anchor="middle" fill="#1e3a5f" font-weight="600">The services stay ClusterIP — private. Only the ingress controller is exposed to the internet.</text>
</svg>
