<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
      .mono12 { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <filter id="bsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="bamber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
    <marker id="bred" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="900" height="580" fill="#ffffff"/>

  <text x="40" y="46" class="title">base64 is an encoding, not a lock</text>
  <text x="40" y="68" class="subtitle">Nothing in this round trip takes a key — which is the whole reason a Secret is not private.</text>

  <!-- plaintext -->
  <g filter="url(#bsoft)">
    <rect x="40" y="104" width="228" height="92" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  </g>
  <rect x="40" y="104" width="228" height="26" rx="10" fill="#64748b"/>
  <rect x="40" y="117" width="228" height="13" fill="#64748b"/>
  <text x="154" y="123" class="badge" fill="#ffffff" text-anchor="middle">WHAT YOU HAVE</text>
  <text x="154" y="154" class="mono" text-anchor="middle" fill="#334155">postgres://appuser:</text>
  <text x="154" y="172" class="mono" text-anchor="middle" fill="#334155">s3cr3t@db:5432/appdb</text>
  <text x="154" y="190" class="tiny" text-anchor="middle" fill="#94a3b8">plain text</text>

  <path d="M 268 150 L 322 150" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#bamber)"/>
  <text x="295" y="140" class="tiny" text-anchor="middle" fill="#b45309">encode</text>

  <!-- encoded -->
  <g filter="url(#bsoft)">
    <rect x="326" y="104" width="248" height="92" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  </g>
  <rect x="326" y="104" width="248" height="26" rx="10" fill="#d97706"/>
  <rect x="326" y="117" width="248" height="13" fill="#d97706"/>
  <text x="450" y="123" class="badge" fill="#ffffff" text-anchor="middle">WHAT ETCD STORES</text>
  <text x="450" y="154" class="mono" text-anchor="middle" fill="#78350f">cG9zdGdyZXM6Ly9hcHB1</text>
  <text x="450" y="172" class="mono" text-anchor="middle" fill="#78350f">c2VyOnMzY3IzdEBkYjo…</text>
  <text x="450" y="190" class="tiny" text-anchor="middle" fill="#92400e">looks scrambled — isn't</text>

  <path d="M 574 150 L 628 150" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#bred)"/>
  <text x="601" y="140" class="tiny" text-anchor="middle" fill="#b91c1c">decode</text>

  <!-- back to plaintext -->
  <g filter="url(#bsoft)">
    <rect x="632" y="104" width="228" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <rect x="632" y="104" width="228" height="26" rx="10" fill="#dc2626"/>
  <rect x="632" y="117" width="228" height="13" fill="#dc2626"/>
  <text x="746" y="123" class="badge" fill="#ffffff" text-anchor="middle">WHAT ANYONE GETS BACK</text>
  <text x="746" y="154" class="mono" text-anchor="middle" fill="#7f1d1d">postgres://appuser:</text>
  <text x="746" y="172" class="mono" text-anchor="middle" fill="#7f1d1d">s3cr3t@db:5432/appdb</text>
  <text x="746" y="190" class="tiny" text-anchor="middle" fill="#b91c1c">identical to the original</text>

  <!-- no key annotation -->
  <path d="M 450 200 L 450 224" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="250" y="226" width="400" height="38" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="450" y="250" class="small" text-anchor="middle" font-weight="700" fill="#b91c1c">No password. No key. No algorithm to break.</text>

  <!-- the command -->
  <rect x="150" y="286" width="600" height="96" rx="10" fill="#1e293b"/>
  <text x="170" y="312" class="mono" fill="#94a3b8"># the entire "attack", available to anyone who can read the object</text>
  <text x="170" y="340" class="mono12" fill="#4ade80">kubectl get secret backend-secret \</text>
  <text x="170" y="360" class="mono12" fill="#4ade80">  -o jsonpath='{.data.DATABASE_URL}' | base64 -d</text>
  <text x="170" y="378" class="mono" fill="#facc15">postgres://appuser:s3cr3t@db:5432/appdb</text>

  <!-- what it does buy you -->
  <rect x="40" y="402" width="400" height="120" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="240" y="426" class="small" text-anchor="middle" font-weight="700" fill="#065f46">What a Secret genuinely gives you</text>
  <text x="58" y="450" class="tiny" fill="#065f46">• Values stay out of pod specs and out of git</text>
  <text x="58" y="470" class="tiny" fill="#065f46">• RBAC can be scoped separately from ConfigMaps</text>
  <text x="58" y="490" class="tiny" fill="#065f46">• Never written to disk on the node — kept in memory</text>
  <text x="58" y="510" class="tiny" fill="#065f46">• Values are hidden from describe and most log output</text>

  <rect x="460" y="402" width="400" height="120" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="2"/>
  <text x="660" y="426" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">What it does not give you</text>
  <text x="478" y="450" class="tiny" fill="#7f1d1d">• Protection from anyone with get access on secrets</text>
  <text x="478" y="470" class="tiny" fill="#7f1d1d">• Protection from a compromised node or etcd backup</text>
  <text x="478" y="490" class="tiny" fill="#7f1d1d">• Any reason to commit the YAML to a public repo</text>
  <text x="478" y="510" class="tiny" fill="#7f1d1d">• Encryption — unless you switch it on yourself</text>

  <!-- caption -->
  <rect x="40" y="534" width="820" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="556" class="small" text-anchor="middle" font-weight="700" fill="#92400e">Treat a Secret manifest exactly like the password it contains — because that is all it is.</text>
</svg>
