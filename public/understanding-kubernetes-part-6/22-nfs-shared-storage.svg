<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <filter id="nsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="nblue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#326CE5"/>
    </marker>
    <marker id="namber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#ffffff"/>

  <text x="40" y="46" class="title">One NFS export, many nodes at once</text>
  <text x="40" y="68" class="subtitle">ReadWriteMany: every pod sees the same filesystem, wherever it was scheduled.</text>

  <!-- cluster box -->
  <rect x="40" y="92" width="470" height="360" rx="14" fill="#f8fbff" stroke="#326CE5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="60" y="116" class="badge" fill="#326CE5">DIGITALOCEAN KUBERNETES CLUSTER</text>

  <!-- node A -->
  <g filter="url(#nsoft)">
    <rect x="60" y="132" width="200" height="146" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="160" y="156" class="badge" text-anchor="middle" fill="#334155">NODE · cd5nq</text>
  <rect x="78" y="168" width="164" height="66" rx="8" fill="#eaf1fd" stroke="#326CE5" stroke-width="1.5"/>
  <text x="160" y="190" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">writer-2xk4p</text>
  <text x="160" y="210" class="mono" text-anchor="middle" fill="#1d4ed8">/data</text>
  <text x="160" y="226" class="tiny" text-anchor="middle" fill="#1d4ed8">writes shared.txt</text>
  <text x="160" y="256" class="tiny" text-anchor="middle" fill="#64748b">kubelet mounts nfs here</text>

  <!-- node B -->
  <g filter="url(#nsoft)">
    <rect x="290" y="132" width="200" height="146" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  </g>
  <text x="390" y="156" class="badge" text-anchor="middle" fill="#334155">NODE · cd5nr</text>
  <rect x="308" y="168" width="164" height="66" rx="8" fill="#eaf1fd" stroke="#326CE5" stroke-width="1.5"/>
  <text x="390" y="190" class="small" text-anchor="middle" font-weight="700" fill="#1e3a5f">writer-hm9vz</text>
  <text x="390" y="210" class="mono" text-anchor="middle" fill="#1d4ed8">/data</text>
  <text x="390" y="226" class="tiny" text-anchor="middle" fill="#1d4ed8">reads shared.txt</text>
  <text x="390" y="256" class="tiny" text-anchor="middle" fill="#64748b">kubelet mounts nfs here</text>

  <!-- pvc / pv -->
  <line x1="160" y1="288" x2="160" y2="316" stroke="#326CE5" stroke-width="2" marker-end="url(#nblue)"/>
  <line x1="390" y1="288" x2="390" y2="316" stroke="#326CE5" stroke-width="2" marker-end="url(#nblue)"/>

  <rect x="80" y="322" width="390" height="42" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="275" y="340" class="badge" text-anchor="middle" fill="#5b21b6">PVC · nfs-pvc — RWX, 2Gi, class nfs</text>
  <text x="275" y="357" class="tiny" text-anchor="middle" fill="#7c3aed">both pods mount the same claim</text>

  <rect x="80" y="378" width="390" height="52" rx="8" fill="#eaf1fd" stroke="#326CE5" stroke-width="2"/>
  <text x="275" y="398" class="badge" text-anchor="middle" fill="#1e3a5f">PV · nfs-pv — RWX, 10Gi, Retain, class nfs</text>
  <text x="275" y="416" class="mono" text-anchor="middle" fill="#1d4ed8">nfs: 52.66.197.168:/exports</text>

  <!-- link to ec2 -->
  <line x1="518" y1="404" x2="600" y2="404" stroke="#d97706" stroke-width="2.5" marker-end="url(#namber)"/>
  <path d="M160 278 C 160 300, 660 300, 660 322" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M390 278 C 390 296, 660 300, 660 322" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="620" y="296" class="tiny" fill="#b45309">tcp/2049</text>

  <!-- EC2 -->
  <g filter="url(#nsoft)">
    <rect x="560" y="132" width="300" height="298" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  </g>
  <rect x="560" y="132" width="300" height="26" rx="12" fill="#d97706"/>
  <rect x="560" y="146" width="300" height="12" fill="#d97706"/>
  <text x="710" y="150" class="badge" fill="#ffffff" text-anchor="middle">EC2 · t3.micro · docker compose</text>

  <rect x="582" y="176" width="256" height="70" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="598" y="196" class="mono" fill="#92400e">nfs-server-alpine</text>
  <text x="598" y="216" class="mono" fill="#b45309">privileged · port 2049</text>
  <text x="598" y="232" class="mono" fill="#b45309">SHARED_DIRECTORY=/exports</text>

  <rect x="582" y="258" width="256" height="88" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="598" y="278" class="small" font-weight="700" fill="#92400e">~/nfs/data (host)</text>
  <text x="598" y="298" class="mono" fill="#b45309">hello.txt</text>
  <text x="598" y="314" class="mono" fill="#b45309">shared.txt   ← the real bytes</text>
  <text x="598" y="334" class="tiny" fill="#b45309">bind-mounted to /exports in the container</text>

  <rect x="582" y="358" width="256" height="56" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
  <text x="598" y="378" class="badge" fill="#b91c1c">SINGLE POINT OF FAILURE</text>
  <text x="598" y="396" class="tiny" fill="#dc2626">one box, one disk, no replication —</text>
  <text x="598" y="410" class="tiny" fill="#dc2626">use a managed file service for real work</text>

  <rect x="40" y="472" width="820" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="60" y="498" class="small" font-weight="700" fill="#334155">What survives what</text>
  <text x="60" y="520" class="tiny" fill="#4b5563">Delete a pod → data survives. Delete the deployment → data survives. Delete the whole cluster → data still survives.</text>
  <text x="60" y="538" class="tiny" fill="#4b5563">Terminate this EC2 instance → the data is gone, because that is the one machine actually holding it.</text>
  <text x="60" y="556" class="tiny" fill="#4b5563">The mount is performed by the kubelet on the node, not by anything inside your container.</text>
</svg>
