<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
      .step { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .clock { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; font-weight: 700; fill: #64748b; }
    </style>
    <filter id="esoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="egrey" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="660" fill="#ffffff"/>

  <text x="40" y="46" class="title">One commit, end to end</text>
  <text x="40" y="68" class="subtitle">Nothing in this chain holds a kubeconfig. The handoff between CI and the cluster is a git commit.</text>

  <!-- spine -->
  <line x1="128" y1="108" x2="128" y2="560" stroke="#e2e8f0" stroke-width="3"/>

  <!-- 1 -->
  <circle cx="128" cy="132" r="15" fill="#326CE5"/>
  <text x="128" y="137" class="step" text-anchor="middle">1</text>
  <text x="40" y="137" class="clock">t+0s</text>
  <g filter="url(#esoft)">
    <rect x="166" y="106" width="694" height="54" rx="10" fill="#eff6ff" stroke="#326CE5" stroke-width="2"/>
  </g>
  <text x="186" y="130" class="small" fill="#1e40af" font-weight="700">You push to todo-app-argoCD, branch main</text>
  <text x="186" y="150" class="mono" fill="#475569">git commit -am "change the heading"  &amp;&amp;  git push</text>

  <!-- 2 -->
  <circle cx="128" cy="204" r="15" fill="#1f2937"/>
  <text x="128" y="209" class="step" text-anchor="middle">2</text>
  <text x="40" y="209" class="clock">t+5s</text>
  <g filter="url(#esoft)">
    <rect x="166" y="178" width="694" height="54" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="186" y="202" class="small" fill="#1e293b" font-weight="700">GitHub Actions starts prod.yml</text>
  <text x="186" y="222" class="tiny" fill="#475569">Checkout, docker login with DOCKER_USERNAME / DOCKER_SECRET, set up buildx.</text>

  <!-- 3 -->
  <circle cx="128" cy="276" r="15" fill="#0ea5e9"/>
  <text x="128" y="281" class="step" text-anchor="middle">3</text>
  <text x="40" y="281" class="clock">t+2m</text>
  <g filter="url(#esoft)">
    <rect x="166" y="250" width="694" height="58" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <text x="186" y="274" class="small" fill="#075985" font-weight="700">Build and push the image, tagged with the commit SHA</text>
  <text x="186" y="296" class="mono" fill="#0c4a6e">dheerajsai15/todo-app-argocd:158f0019...</text>
  <text x="536" y="296" class="tiny" fill="#94a3b8">a tag that can never mean two things</text>

  <!-- 4 -->
  <circle cx="128" cy="352" r="15" fill="#EF7B4D"/>
  <text x="128" y="357" class="step" text-anchor="middle">4</text>
  <text x="40" y="357" class="clock">t+2m10s</text>
  <g filter="url(#esoft)">
    <rect x="166" y="322" width="694" height="62" rx="10" fill="#fff7ed" stroke="#EF7B4D" stroke-width="2"/>
  </g>
  <text x="186" y="346" class="small" fill="#9a3412" font-weight="700">Clone argo-deployment, sed the image line, commit, push with the PAT</text>
  <text x="186" y="368" class="mono" fill="#7c2d12">sed -i 's|image: dheerajsai15/todo-app-argocd:.*|image: ...:$SHA|' manifest.yml</text>

  <!-- 5 -->
  <circle cx="128" cy="428" r="15" fill="#EF7B4D"/>
  <text x="128" y="433" class="step" text-anchor="middle">5</text>
  <text x="40" y="433" class="clock">+0-3m</text>
  <g filter="url(#esoft)">
    <rect x="166" y="398" width="694" height="62" rx="10" fill="#fff7ed" stroke="#EF7B4D" stroke-width="2"/>
  </g>
  <text x="186" y="422" class="small" fill="#9a3412" font-weight="700">Argo CD notices the commit</text>
  <text x="186" y="444" class="tiny" fill="#7c2d12">The poll is 120s plus up to 60s of jitter, so this step is the slow one. A webhook drops it to about a second.</text>

  <!-- 6 -->
  <circle cx="128" cy="504" r="15" fill="#EF7B4D"/>
  <text x="128" y="509" class="step" text-anchor="middle">6</text>
  <text x="40" y="509" class="clock">+2s</text>
  <g filter="url(#esoft)">
    <rect x="166" y="474" width="694" height="62" rx="10" fill="#fff7ed" stroke="#EF7B4D" stroke-width="2"/>
  </g>
  <text x="186" y="498" class="small" fill="#9a3412" font-weight="700">OutOfSync, then automated sync applies the manifest</text>
  <text x="186" y="520" class="tiny" fill="#7c2d12">One field differs: the image tag. Argo CD applies the manifest and steps out of the way.</text>

  <!-- 7 -->
  <circle cx="128" cy="578" r="15" fill="#22c55e"/>
  <text x="128" y="583" class="step" text-anchor="middle">7</text>
  <text x="40" y="583" class="clock">+30s</text>
  <g filter="url(#esoft)">
    <rect x="166" y="550" width="694" height="62" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  </g>
  <text x="186" y="574" class="small" fill="#15803d" font-weight="700">Kubernetes starts the new container</text>
  <text x="186" y="596" class="tiny" fill="#166534">The kubelet pulls the new image and replaces the running container. Synced and Healthy.</text>

  <text x="40" y="640" class="small" fill="#334155">Steps 1 to 4 are CI and know nothing about Kubernetes. Steps 5 to 7 are the cluster and know nothing about CI.</text>
</svg>
