<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .node-label { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; }
    </style>
    <filter id="tsoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="tlock" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#059669"/>
    </marker>
    <marker id="tplain" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <marker id="tamber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Header -->
  <text x="40" y="46" class="title">HTTPS Stops at the Ingress</text>
  <text x="40" y="68" class="subtitle">The controller terminates TLS once, for every service behind it — your apps keep speaking plain HTTP</text>

  <!-- Browser -->
  <g filter="url(#tsoft)">
    <rect x="40" y="168" width="170" height="86" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="125" y="198" class="small" text-anchor="middle" font-weight="700" fill="#92400e">🌍 Browser</text>
  <text x="125" y="220" class="mono" text-anchor="middle" fill="#92400e" font-size="11">🔒 https://</text>
  <text x="125" y="240" class="mono" text-anchor="middle" fill="#92400e" font-size="11">shop.example.com</text>

  <!-- encrypted arrow -->
  <path d="M 212 210 L 342 210" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#tlock)"/>
  <text x="277" y="196" class="tiny" text-anchor="middle" fill="#059669" font-weight="700">443 · encrypted</text>
  <text x="277" y="232" class="tiny" text-anchor="middle" fill="#6b7280">public internet</text>

  <!-- Cluster boundary -->
  <rect x="350" y="104" width="515" height="272" rx="16" fill="#fafaf9" stroke="#a8a29e" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="372" y="130" class="badge" fill="#78716c">☸️ YOUR CLUSTER</text>

  <!-- Ingress controller -->
  <g filter="url(#tsoft)">
    <rect x="380" y="150" width="190" height="118" rx="12" fill="#326CE5"/>
  </g>
  <text x="475" y="182" class="node-label" fill="#ffffff" text-anchor="middle" font-size="14">Ingress Controller</text>
  <text x="475" y="208" class="tiny" fill="#dbeafe" text-anchor="middle">decrypts the request here</text>
  <text x="475" y="228" class="tiny" fill="#dbeafe" text-anchor="middle">one cert, all backends</text>
  <text x="475" y="249" class="tiny" fill="#bfdbfe" text-anchor="middle">HTTP is redirected to HTTPS</text>

  <!-- secret -->
  <g filter="url(#tsoft)">
    <rect x="380" y="296" width="190" height="60" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="475" y="320" class="small" text-anchor="middle" font-weight="700" fill="#92400e">🔑 Secret: shop-tls</text>
  <text x="475" y="342" class="mono" text-anchor="middle" fill="#92400e" font-size="11">tls.crt · tls.key</text>
  <path d="M 475 296 L 475 274" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#tamber)"/>

  <!-- plain arrow -->
  <path d="M 572 208 L 672 208" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#tplain)"/>
  <text x="622" y="194" class="tiny" text-anchor="middle" fill="#475569" font-weight="700">80 · plain</text>
  <text x="622" y="230" class="tiny" text-anchor="middle" fill="#6b7280">inside cluster</text>

  <!-- backend -->
  <g filter="url(#tsoft)">
    <rect x="680" y="168" width="170" height="86" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="765" y="196" class="small" text-anchor="middle" font-weight="700" fill="#065f46">Service → pods</text>
  <text x="765" y="218" class="tiny" text-anchor="middle" fill="#065f46">no certificates,</text>
  <text x="765" y="236" class="tiny" text-anchor="middle" fill="#065f46">no TLS code in your app</text>

  <!-- caption -->
  <rect x="40" y="404" width="820" height="66" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="450" y="430" class="small" text-anchor="middle" font-weight="700" fill="#047857">Add cert-manager and the certificate renews itself.</text>
  <text x="450" y="452" class="tiny" text-anchor="middle" fill="#065f46">One annotation on the Ingress → it requests a free Let's Encrypt cert and writes it into the Secret for you.</text>
</svg>
