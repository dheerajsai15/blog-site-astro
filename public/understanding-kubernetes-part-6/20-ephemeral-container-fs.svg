<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <filter id="esoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="ered" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="egreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <text x="40" y="46" class="title">Why the data disappeared</text>
  <text x="40" y="68" class="subtitle">Everything a container writes lands in a scratch layer that is destroyed along with it.</text>

  <line x1="450" y1="92" x2="450" y2="500" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- LEFT: no volume -->
  <text x="40" y="112" class="badge" fill="#b91c1c">NO VOLUME — WRITES GO TO THE CONTAINER</text>

  <g filter="url(#esoft)">
    <rect x="40" y="126" width="370" height="196" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <rect x="40" y="126" width="370" height="26" rx="12" fill="#dc2626"/>
  <rect x="40" y="140" width="370" height="12" fill="#dc2626"/>
  <text x="225" y="144" class="badge" fill="#ffffff" text-anchor="middle">CONTAINER · postgres:16</text>

  <rect x="62" y="168" width="326" height="40" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
  <text x="76" y="185" class="small" font-weight="700" fill="#7f1d1d">writable layer</text>
  <text x="76" y="201" class="mono" fill="#b91c1c">/var/lib/postgresql/data  ← every write</text>

  <rect x="62" y="216" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="236" class="mono" fill="#475569">image layer 3   read-only · shared</text>
  <rect x="62" y="250" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="270" class="mono" fill="#475569">image layer 2   read-only · shared</text>
  <rect x="62" y="284" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="76" y="304" class="mono" fill="#475569">image layer 1   read-only · shared</text>

  <line x1="225" y1="330" x2="225" y2="368" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ered)"/>
  <text x="240" y="354" class="tiny" fill="#b91c1c">kubectl delete pod</text>

  <g filter="url(#esoft)">
    <rect x="40" y="378" width="370" height="94" rx="12" fill="#ffffff" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 4"/>
  </g>
  <text x="225" y="406" class="small" text-anchor="middle" font-weight="700" fill="#7f1d1d">writable layer discarded</text>
  <text x="225" y="428" class="tiny" text-anchor="middle" fill="#b91c1c">image layers survive — they were never yours</text>
  <text x="225" y="452" class="mono" text-anchor="middle" fill="#dc2626">ERROR: relation "users" does not exist</text>

  <!-- RIGHT: with volume -->
  <text x="490" y="112" class="badge" fill="#047857">WITH A VOLUME — WRITES LEAVE THE CONTAINER</text>

  <g filter="url(#esoft)">
    <rect x="490" y="126" width="370" height="196" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <rect x="490" y="126" width="370" height="26" rx="12" fill="#10b981"/>
  <rect x="490" y="140" width="370" height="12" fill="#10b981"/>
  <text x="675" y="144" class="badge" fill="#ffffff" text-anchor="middle">CONTAINER · postgres:16</text>

  <rect x="512" y="168" width="326" height="40" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="526" y="185" class="small" font-weight="700" fill="#065f46">mount point</text>
  <text x="526" y="201" class="mono" fill="#047857">/var/lib/postgresql/data  → volume</text>

  <rect x="512" y="216" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="526" y="236" class="mono" fill="#475569">writable layer   only scratch left here</text>
  <rect x="512" y="250" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="526" y="270" class="mono" fill="#475569">image layer 3   read-only · shared</text>
  <rect x="512" y="284" width="326" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="526" y="304" class="mono" fill="#475569">image layer 2   read-only · shared</text>

  <line x1="675" y1="330" x2="675" y2="368" stroke="#10b981" stroke-width="2.5" marker-end="url(#egreen)"/>
  <text x="690" y="354" class="tiny" fill="#047857">kubectl delete pod</text>

  <g filter="url(#esoft)">
    <rect x="490" y="378" width="370" height="94" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <text x="675" y="406" class="small" text-anchor="middle" font-weight="700" fill="#065f46">storage untouched, outside the pod</text>
  <text x="675" y="428" class="tiny" text-anchor="middle" fill="#047857">the next pod mounts the same bytes</text>
  <text x="675" y="452" class="mono" text-anchor="middle" fill="#047857">1 | dheeraj</text>

  <text x="450" y="516" class="tiny" text-anchor="middle" fill="#6b7280">The whole rest of this post is one question: where does that volume on the right actually live?</text>
</svg>
