<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a2e; }
      .subtitle { font-size: 13px; fill: #6b7280; }
      .panel { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; fill: #374151; }
      .tiny { font-size: 11px; fill: #4b5563; }
      .badge { font-size: 11px; font-weight: 600; }
      .mono { font-family: 'Consolas', 'Monaco', monospace; font-size: 11px; }
    </style>
    <filter id="psoft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.10"/>
    </filter>
    <marker id="pred" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#dc2626"/>
    </marker>
    <marker id="pgreen" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#15803d"/>
    </marker>
    <marker id="pgrey" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <text x="40" y="46" class="title">Who initiates the change</text>
  <text x="40" y="68" class="subtitle">Same manifests, same cluster. The difference is which side opens the connection.</text>

  <!-- ============ LEFT: PUSH ============ -->
  <rect x="40" y="94" width="390" height="392" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="62" y="124" class="panel" fill="#b91c1c">PUSH  ·  kubectl apply</text>
  <text x="62" y="144" class="tiny" fill="#b91c1c">Parts 2 through 7</text>

  <g filter="url(#psoft)">
    <rect x="62" y="162" width="152" height="66" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  </g>
  <text x="80" y="188" class="small" fill="#7f1d1d" font-weight="700">Your laptop</text>
  <text x="80" y="208" class="mono" fill="#991b1b">~/.kube/config</text>
  <text x="80" y="221" class="tiny" fill="#b91c1c">admin credentials</text>

  <g filter="url(#psoft)">
    <rect x="256" y="162" width="152" height="66" rx="10" fill="#ffffff" stroke="#f87171" stroke-width="2"/>
  </g>
  <text x="274" y="188" class="small" fill="#7f1d1d" font-weight="700">CI runner</text>
  <text x="274" y="208" class="mono" fill="#991b1b">KUBECONFIG secret</text>
  <text x="274" y="221" class="tiny" fill="#b91c1c">admin credentials</text>

  <path d="M138 232 L138 268" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#pred)"/>
  <path d="M332 232 L332 268" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#pred)"/>
  <text x="152" y="256" class="tiny" fill="#b91c1c">writes</text>

  <g filter="url(#psoft)">
    <rect x="62" y="274" width="346" height="76" rx="10" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  </g>
  <text x="82" y="300" class="small" fill="#1e40af" font-weight="700">API server</text>
  <text x="82" y="320" class="tiny" fill="#475569">Accepts whatever arrives. Does not know which file,</text>
  <text x="82" y="336" class="tiny" fill="#475569">which branch, or which commit it came from.</text>

  <rect x="62" y="368" width="346" height="100" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="82" y="392" class="badge" fill="#b91c1c">WHAT THIS COSTS YOU</text>
  <text x="82" y="414" class="tiny" fill="#7f1d1d">• Every actor needs write credentials to the cluster</text>
  <text x="82" y="432" class="tiny" fill="#7f1d1d">• Nothing records what is supposed to be running</text>
  <text x="82" y="450" class="tiny" fill="#7f1d1d">• A hand edit at 2am is invisible and permanent</text>

  <!-- ============ RIGHT: PULL ============ -->
  <rect x="470" y="94" width="390" height="392" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="492" y="124" class="panel" fill="#15803d">PULL  ·  Argo CD</text>
  <text x="492" y="144" class="tiny" fill="#15803d">This post onward</text>

  <g filter="url(#psoft)">
    <rect x="492" y="162" width="152" height="66" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>
  <text x="510" y="188" class="small" fill="#14532d" font-weight="700">Git repo</text>
  <text x="510" y="208" class="mono" fill="#166534">manifest.yml</text>
  <text x="510" y="221" class="tiny" fill="#15803d">the only source of truth</text>

  <path d="M648 195 L690 195" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#pgrey)"/>

  <g filter="url(#psoft)">
    <rect x="696" y="162" width="148" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="714" y="188" class="small" fill="#334155" font-weight="700">You / CI</text>
  <text x="714" y="208" class="tiny" fill="#64748b">open a pull request</text>
  <text x="714" y="223" class="tiny" fill="#64748b">no cluster access at all</text>

  <path d="M568 268 L568 234" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#pgreen)"/>
  <text x="582" y="256" class="tiny" fill="#15803d">polls every ~3 min</text>

  <g filter="url(#psoft)">
    <rect x="492" y="274" width="352" height="76" rx="10" fill="#ffffff" stroke="#EF7B4D" stroke-width="2"/>
  </g>
  <text x="512" y="300" class="small" fill="#9a3412" font-weight="700">Argo CD, running inside the cluster</text>
  <text x="512" y="320" class="tiny" fill="#475569">Compares git against live, and closes the gap.</text>
  <text x="512" y="336" class="tiny" fill="#475569">Its credentials never leave the cluster.</text>

  <path d="M700 354 L700 382" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#pgreen)"/>

  <g filter="url(#psoft)">
    <rect x="492" y="388" width="352" height="52" rx="10" fill="#ffffff" stroke="#326CE5" stroke-width="2"/>
  </g>
  <text x="512" y="412" class="small" fill="#1e40af" font-weight="700">API server</text>
  <text x="512" y="430" class="tiny" fill="#475569">One client. One audit trail. One reviewable history.</text>

  <text x="492" y="462" class="tiny" fill="#15803d">The arrow into the cluster starts inside it.</text>
  <text x="492" y="478" class="tiny" fill="#15803d">Nothing outside holds a kubeconfig.</text>

  <text x="40" y="520" class="small" fill="#334155">Push means the cluster trusts whoever reaches it. Pull means the cluster trusts one repo it reads itself.</text>
  <text x="40" y="540" class="small" fill="#334155">Everything else in this post follows from that one reversal.</text>
</svg>
